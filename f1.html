<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>
        @font-face {
            font-family: "Marketing Disparities";
            src: url("./fonts/MarketingDisparitiesDemoRegular-m27a9.ttf") format("truetype");
        }

        body {
            font-family: "Marketing Disparities", sans-serif;

        }
        #hello {
            color: red;
        }
        #custom-paragraph {
            color: blue;
        }
        p {
            color: green;
        }
        #email-input {
            border: 2px solid blue;
            padding: 5px;
            background-color: lightgray;
        }
        #password-input {
            border: 2px solid red;
            padding: 5px;
            background-color: rgb(177, 27, 27);
        }

    </style>
</head>

<body>

    <h1 id="hello" class="custom-font">Hello World</h1>
    <p id="custom-paragraph">This is my custom font.</p>
    <p id="element">This is another paragraph.</p>
    <input type="email" placeholder="Enter your email" id="email-input" />
    <input type="password" placeholder="Enter your password" id="password-input" />

</body>

</html>
