<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Form Pseudo-Classes</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			font-family: Arial, sans-serif;
			background: #eef2ff;
			color: #1f2937;
		}
		form {
			width: min(100%, 460px);
			padding: 30px;
			background: #fff;
			border-radius: 14px;
			box-shadow: 0 12px 35px #263b771f;
		}
		h1 { margin: 0 0 8px; color: #3730a3; }
		.intro { margin: 0 0 24px; color: #6b7280; }
		label { display: block; margin: 16px 0 7px; font-weight: 600; }
		input, select, textarea {
			width: 100%;
			padding: 11px 12px;
			border: 2px solid #d1d5db;
			border-radius: 8px;
			font: inherit;
			outline: none;
			transition: .2s;
		}
		input:focus, select:focus, textarea:focus {
			border-color: #6366f1;
			box-shadow: 0 0 0 3px #6366f133;
		}
		input:valid, select:valid, textarea:valid { border-color: #22c55e; }
		input:invalid:not(:placeholder-shown), textarea:invalid:not(:placeholder-shown) {
			border-color: #ef4444;
		}
		input[type="checkbox"] { width: auto; accent-color: #4f46e5; }
		.check { display: flex; gap: 9px; align-items: center; font-weight: normal; }
		button {
			width: 100%;
			margin-top: 22px;
			padding: 12px;
			border: 0;
			border-radius: 8px;
			background: #4f46e5;
			color: white;
			font: 600 1rem inherit;
			cursor: pointer;
		}
		button:hover { background: #3730a3; }
		button:disabled { background: #9ca3af; cursor: not-allowed; }
		form:has(input:invalid:not(:placeholder-shown)) button { opacity: .7; }
	</style>
</head>
<body>
	<form>
		<h1>Contact Form</h1>
		<p class="intro">Fields use CSS form pseudo-classes.</p>

		<label for="name">Full name</label>
		<input id="name" name="name" type="text" placeholder="Your name" required />

		<label for="email">Email address</label>
		<input id="email" name="email" type="email" placeholder="you@example.com" required />

		<label for="topic">Topic</label>
		<select id="topic" name="topic" required>
			<option value="">Choose a topic</option>
			<option>General question</option>
			<option>Feedback</option>
			<option>Support</option>
		</select>

		<label for="message">Message</label>
		<textarea id="message" name="message" rows="4" placeholder="Write your message" required></textarea>

		<label class="check"><input type="checkbox" required /> I agree to the terms</label>
		<button type="submit">Send message</button>
	</form>
</body>
</html>
