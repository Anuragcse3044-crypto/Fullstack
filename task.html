<!DOCTYPE html>
<html>
<head>
    <title>SaaS Landing Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #F8FAFC;
            color: #0F172A;
        }

        nav {
            height: 72px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #475569;
        }

        .menu {
            display: none;
        }

        .hero {
            min-height: 520px;
            padding: 80px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 650px;
            font-size: 18px;
            color: #475569;
            line-height: 1.6;
        }

        button {
            padding: 12px 20px;
            background: #4F46E5;
            color: white;
            border: 0;
            border-radius: 5px;
        }

        .features {
            padding: 40px 24px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .card {
            background: white;
            padding: 24px;
            border: 1px solid #E2E8F0;
        }

        @media (max-width: 1023px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 639px) {
            nav a {
                display: none;
            }

            .menu {
                display: block;
            }

            .hero {
                text-align: center;
                align-items: center;
            }

            h1 {
                font-size: 36px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>MySaaS</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Pricing</a>
            <button class="menu">☰</button>
        </div>
    </nav>

    <section class="hero">
        <h1>Build Better Products Faster</h1>
        <p>Simple tools to help your team build, manage and grow your business.</p>
        <button>Get Started</button>
    </section>

    <section class="features">
        <h2>Our Features</h2>

        <div class="cards">
            <div class="card">
                <h3>Easy to Use</h3>
                <p>Simple tools that anyone can use.</p>
            </div>

            <div class="card">
                <h3>Fast & Secure</h3>
                <p>Fast and reliable performance.</p>
            </div>

            <div class="card">
                <h3>Powerful Tools</h3>
                <p>Everything you need for your business.</p>
            </div>
        </div>
    </section>

</body>
</html>
