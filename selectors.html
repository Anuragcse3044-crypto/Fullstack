<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selectors</title>
    <style>
        /* * {
            color: red;
            background-color: #000;
        } */


        /* *{
            margin: 0;
            padding: 0;
        } */

        h2 {
            color: red;

        }

        li {
            font-size: 40px;
        }

        .cl {
            color: blue;
        }

        #myid {
            color: rgb(10, 244, 10);
        }


        input[type="email"] {
            border: 2px solid rgb(255, 0, 4);
            padding: 5px;
            background-color: lightgray;
        }


        input[type="password"] {
            border: 2px solid rgb(255, 56, 2);
            padding: 5px;
            background-color: rgb(207, 217, 210);
        }

        section>h2{
            color: rgb(255, 0, 0);
        }
        .pscl:hover{
            color: rgb(255, 0, 0);
        }
        button{
            padding: 10px;
            font-size: 20px;
            background-color: white;
            font-size: 30px;
        }
        button:active{
            box-shadow: inset 0 0 10px rgb(0, 0, 0);
            background-color: grey;
        }
        /* button:checked{
            background-color: rgb(0, 0, 0);
        } */


       /* input[type="checkbox"]:checked{
            background-color:rgb(244, 6, 6);

        }
        input[type="checkbox"]:{
            height: 50px;
            width: 50px;
        } */
         
        a::after{
            content: " (this is a link)";
        }
        a:visited {
            color: rgb(255, 0, 0);
        }
        a:hover{
            color: rgb(0, 0, 0);
        }

    </style>
</head>

<body>
    <h2>Selectors</h2>
    <ul>
        <li class="cl">Element Selector</li>
        <li id="myid">Id Selector</li>
        <li>Class Selector</li>
        <li>Group Selector</li>
        <li class="cl">Universal Selector</li>
        <li>Attribute Selector</li>
        <li class="pscl">Pseudo-class Selector</li>
        <li>Pseudo-element Selector</li>
    </ul>
    <input type="email" placeholder="Enter your email" /><br><br>
    <input type="password" placeholder="Enter your password" />
    

    <section>
        <h2>Section</h2>
        <p>this is section element</p>
        <p>this is a paragraph </p>
    </section><br>

    <button class="pscl">Click Me</button>
    <input type="checkbox" id="mycheck" /><br><br>

    <a href="https://student.glauniversity.in/Main/Index" target="_blank">Glams</a><br><br>
    <a href="#2">link</a>

    
</body>

</html>
