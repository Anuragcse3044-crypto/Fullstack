<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /*
        :enabled
        :disabled
        :required
        :optional
        :read-only
        :read-write
        :placeholder-shown
        :valid
        :invalid
        :in-range
        :out-of-range
        */

        input {
            font-size: 40px;
            border-width: 0 0 2px 0;
            border-color: black;
        }

        input:required {
            border-color: red;
        }

        input:optional {
            border-color: green;
        }

        input:disabled {
            background-color: lightgray;
        }
        input:in-range{
            background-color: beige;
            
        }
    

        
        
    </style>
</head>

<body>
    <form>
        <input type="text" placeholder="First name" required>
        <br><br>

        <input type="text" placeholder="Middle Name" not-hover>
        <br><br>

        <input type="text" placeholder="Last Name" required>
        <input type="text" placeholder="mathura"disabled>
        <br>
        <input type="number" placeholder="phone number" in-range>
        <input type="email" placeholder="Email" valid>
        <input type="number" placeholder="Age" min="18" max="60" in-range>
        <br>
                <button>submit</button>
    </form>
</body>
</html>
