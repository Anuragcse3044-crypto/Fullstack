<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Layout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ddd;
        }

        .container {
            width: 600px;
            margin: 50px auto;
            padding: 10px;

            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 120px 120px 100px;

            gap: 8px;

            background-color: white;
            border: 2px solid black;
            border-radius: 15px;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        /* First box takes 2 columns */
        .box1 {
            grid-column: 1 / 3;
            background-color: #eee8cf;
        }

        .box2 {
            background-color: #b8d5bd;
        }

        .box3 {
            background-color: #f47b70;
        }

        .box4 {
            background-color: #eee8cf;
        }

        .box5 {
            background-color: #e7d397;
        }

        .box6 {
            background-color: #a8d98f;
        }

        .box7 {
            background-color: #b5cdbb;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box box1">
            1
        </div>

        <div class="box box2">
            2
        </div>

        <div class="box box3">
            3
        </div>

        <div class="box box4">
            4
        </div>

        <div class="box box5">
          5
        </div>

        <div class="box box6">
            6
        </div>

        <div class="box box7">
            7
        </div>

    </div>

</body>
</html>
