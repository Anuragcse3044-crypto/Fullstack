<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login_page</title>
    <style>
        .container{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .card {
            width: 300px;
            padding: 20px;
            border: 1px solid #eb1f1f;
            border-radius: 5px;
            box-shadow: 0 2px 20px rgba(15, 13, 13, 0.1);
        }
        .card h2 {
            text-align: center;
            /* margin-bottom: 20px; */
        }
        .button{
            width: 100%;
            padding: 10px;
            background-color: #eb1f1f;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Login</h2>
            <form>
                <p>Username</p>
                <input type="text" placeholder="Username">
                <p>Password</p>
                <input type="password" placeholder="Password"><br><br>
                <button type="submit" class="button">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
