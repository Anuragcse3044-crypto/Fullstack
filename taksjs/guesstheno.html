<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Guess the Number</title>
	<style>
		body { font-family: Arial, sans-serif; background: #f3f6fb; color: #243047; }
		main { max-width: 400px; margin: 40px auto; padding: 28px; background: #fff; border-radius: 12px; box-shadow: 0 6px 20px #24304718; }
		.tag { color: #5268d8; font-size: .85rem; font-weight: bold; }
		h1 { margin: 8px 0; }
		.intro, .range { color: #596579; }
		form { display: flex; gap: 8px; }
		input, button { padding: 10px 12px; border: 1px solid #cbd3e1; border-radius: 6px; font: inherit; }
		input { min-width: 0; flex: 1; }
		button { background: #5268d8; color: white; border-color: #5268d8; cursor: pointer; }
		button:hover { background: #4055c2; }
		button:disabled { opacity: .6; cursor: not-allowed; }
		input:focus, button:focus-visible { outline: 3px solid #5268d855; outline-offset: 2px; }
		.message { min-height: 1.5em; margin: 18px 0 8px; }
		.count { color: #596579; }
		.reset { background: #fff; color: #5268d8; }
		.reset:hover { background: #f0f2ff; }
		@media (max-width: 480px) { main { margin: 20px 12px; padding: 22px; } }
	</style>
</head>
<body>
	<main>
		<h1>Guess the Number</h1>
		<p class="range">Pick a whole number from <strong>1 to 100</strong></p>
		<form id="guess-form">
			<input id="guess" type="number" min="1" max="100" step="1" placeholder="Your guess" aria-label="Your guess" required>
			<button type="submit">Guess</button>
		</form>
		<p class="message" id="message" role="status" aria-live="polite">Enter a number to get started.</p>
		<p class="count" id="count">Guesses: 0</p>
		<button class="reset" id="reset" type="button">New game</button>
	</main>
	<script>
		(() => {
			const form = document.getElementById('guess-form');
			const input = document.getElementById('guess');
			const message = document.getElementById('message');
			const count = document.getElementById('count');
			const submit = form.querySelector('button');
			let answer;
			let guesses;
			let finished;

			function startGame() {
				answer = Math.floor(Math.random() * 100) + 1;
				guesses = 0;
				finished = false;
				input.value = '';
				input.disabled = false;
				submit.disabled = false;
				message.textContent = 'Enter a number to get started.';
				count.textContent = 'Guesses: 0';
				input.focus();
			}

			form.addEventListener('submit', (event) => {
				event.preventDefault();
				if (finished) return;
				const value = Number(input.value);
				if (!Number.isInteger(value) || value < 1 || value > 100) {
					message.textContent = 'Enter a whole number from 1 to 100.';
					input.focus();
					return;
				}
				guesses += 1;
				count.textContent = `Guesses: ${guesses}`;
				if (value === answer) {
					message.textContent = `Correct! The number was ${answer}. 🎉`;
					finished = true;
					input.disabled = true;
					submit.disabled = true;
				} else {
					message.textContent = value < answer ? 'Too low — try a higher number!' : 'Too high — try a lower number!';
					input.select();
				}
			});

			document.getElementById('reset').addEventListener('click', startGame);
			startGame();
		})();
	</script>
</body>
</html>
