<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Whack-a-Mole</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: #f4f7f4;
        color: #333;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .game {
        width: min(100%, 430px);
        padding: 24px;
        background: white;
        border-radius: 16px;
    }

    h1 { color: #43845b; }

    .stats {
        display: flex;
        justify-content: space-around;
        margin: 18px 0;
    }

    .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 14px;
        background: #e7f0e8;
        border-radius: 14px;
    }

    .hole {
        height: 90px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        font-size: 2.5rem;
    }

    .hole .mole { display: none; }
    .hole.active .mole { display: inline; }

    #start {
        margin-top: 18px;
        padding: 11px 24px;
        border: 0;
        border-radius: 8px;
        background: #43845b;
        color: white;
        cursor: pointer;
    }

    #start:hover { background: #326b47; }
    #message { min-height: 1.4em; }

    @media (max-width: 360px) {
        .hole { height: 75px; }
    }
</style>
</head>
<body>
	<main class="game">
		<h1>🐹 Whack-a-Mole!</h1>
		<p>Click the mole before it disappears!</p>
		<div class="stats" aria-live="polite">
			<span>Score: <strong id="score">0</strong></span>
			<span>Time: <strong id="time">30</strong>s</span>
		</div>
		<div class="board" aria-label="Game board">
			<button class="hole" aria-label="Hole 1"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 2"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 3"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 4"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 5"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 6"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 7"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 8"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 9"><span class="mole">🐹</span></button>
		</div>
		<button id="start">Start game</button>
		<p id="message" aria-live="polite">Ready?</p>
	</main>
	<script>
		const holes = [...document.querySelectorAll('.hole')];
		const scoreDisplay = document.getElementById('score');
		const timeDisplay = document.getElementById('time');
		const startButton = document.getElementById('start');
		const message = document.getElementById('message');
		let score = 0;
		let timeLeft = 30;
		let playing = false;
		let moleTimer;
		let clockTimer;

		function showMole() {
			holes.forEach(hole => hole.classList.remove('active'));
			holes[Math.floor(Math.random() * holes.length)].classList.add('active');
		}

		function endGame() {
			playing = false;
			clearInterval(moleTimer);
			clearInterval(clockTimer);
			holes.forEach(hole => hole.classList.remove('active'));
			startButton.disabled = false;
			startButton.textContent = 'Play again';
			message.textContent = `Time's up! You scored ${score}.`;
		}

		startButton.addEventListener('click', () => {
			if (playing) return;
			score = 0;
			timeLeft = 30;
			playing = true;
			scoreDisplay.textContent = score;
			timeDisplay.textContent = timeLeft;
			message.textContent = 'Go get that mole!';
			startButton.disabled = true;
			showMole();
			moleTimer = setInterval(showMole, 750);
			clockTimer = setInterval(() => {
				timeLeft--;
				timeDisplay.textContent = timeLeft;
				if (timeLeft <= 0) endGame();
			}, 1000);
		});

		holes.forEach(hole => hole.addEventListener('click', () => {
			if (!playing || !hole.classList.contains('active')) return;
			score++;
			scoreDisplay.textContent = score;
			showMole();
		}));
	</script>
</body>
</html>
