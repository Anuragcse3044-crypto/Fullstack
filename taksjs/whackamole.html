<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Whack-a-Mole</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f3e8ff;
			color: #35204f;
			font-family: Arial, sans-serif;
			text-align: center;
		}
		.game { width: min(100%, 430px); }
		h1 { margin: 0 0 8px; color: #7041a6; }
		.stats { display: flex; justify-content: space-around; margin: 18px 0; font-size: 1.15rem; }
		.board {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 12px;
			padding: 16px;
			border-radius: 18px;
			background: #c4a7e7;
		}
		.hole {
			position: relative;
			height: 100px;
			overflow: hidden;
			border: 0;
			border-radius: 50%;
			background: #51356b;
			box-shadow: inset 0 8px 0 #3c2750;
			cursor: pointer;
			font-size: 2.8rem;
		}
		.hole:focus-visible, #start:focus-visible { outline: 3px solid #f6bd35; outline-offset: 3px; }
		.hole .mole { display: none; }
		.hole.active .mole { display: inline; animation: pop .12s ease-out; }
		@keyframes pop { from { transform: translateY(20px); } to { transform: translateY(0); } }
		#start {
			margin-top: 18px;
			padding: 11px 26px;
			border: 0;
			border-radius: 8px;
			background: #7041a6;
			color: white;
			font-size: 1rem;
			font-weight: bold;
			cursor: pointer;
		}
		#start:hover { background: #583284; }
		#message { min-height: 1.4em; margin: 12px 0 0; }
		@media (max-width: 360px) { .hole { height: 80px; } }
	</style>
</head>
<body>
	<main class="game">
		<h1>🐹 Whack-a-Mole!</h1>
		<p>Click the mole before it disappears!</p>
		<div class="stats" aria-live="polite">
			<span>Score: <strong id="score">0</strong></span>
			<span>Time: <strong id="time">30</strong>s</span>
		</div>
		<div class="board" aria-label="Game board">
			<button class="hole" aria-label="Hole 1"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 2"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 3"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 4"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 5"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 6"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 7"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 8"><span class="mole">🐹</span></button>
			<button class="hole" aria-label="Hole 9"><span class="mole">🐹</span></button>
		</div>
		<button id="start">Start game</button>
		<p id="message" aria-live="polite">Ready?</p>
	</main>
	<script>
		const holes = [...document.querySelectorAll('.hole')];
		const scoreDisplay = document.getElementById('score');
		const timeDisplay = document.getElementById('time');
		const startButton = document.getElementById('start');
		const message = document.getElementById('message');
		let score = 0;
		let timeLeft = 30;
		let playing = false;
		let moleTimer;
		let clockTimer;

		function showMole() {
			holes.forEach(hole => hole.classList.remove('active'));
			holes[Math.floor(Math.random() * holes.length)].classList.add('active');
		}

		function endGame() {
			playing = false;
			clearInterval(moleTimer);
			clearInterval(clockTimer);
			holes.forEach(hole => hole.classList.remove('active'));
			startButton.disabled = false;
			startButton.textContent = 'Play again';
			message.textContent = `Time's up! You scored ${score}.`;
		}

		startButton.addEventListener('click', () => {
			if (playing) return;
			score = 0;
			timeLeft = 30;
			playing = true;
			scoreDisplay.textContent = score;
			timeDisplay.textContent = timeLeft;
			message.textContent = 'Go get that mole!';
			startButton.disabled = true;
			showMole();
			moleTimer = setInterval(showMole, 750);
			clockTimer = setInterval(() => {
				timeLeft--;
				timeDisplay.textContent = timeLeft;
				if (timeLeft <= 0) endGame();
			}, 1000);
		});

		holes.forEach(hole => hole.addEventListener('click', () => {
			if (!playing || !hole.classList.contains('active')) return;
			score++;
			scoreDisplay.textContent = score;
			showMole();
		}));
	</script>
</body>
</html>
