<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Reaction Timer</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			color: #172033;
			background: #eef2f8;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		main { width: min(100%, 620px); text-align: center; }
		h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3rem); }
		.intro { margin: 0 0 24px; color: #596579; }
		#arena {
			min-height: 330px;
			display: grid;
			place-items: center;
			padding: 28px;
			border: 3px solid #d5dce8;
			border-radius: 24px;
			background: #fff;
			box-shadow: 0 16px 40px #1e293b18;
			transition: background-color .15s, border-color .15s;
			user-select: none;
		}
		#arena.waiting { background: #f5b942; border-color: #e6a51f; cursor: pointer; }
		#arena.go { background: #35c982; border-color: #20a96a; cursor: pointer; }
		.content { max-width: 440px; }
		#message { margin: 0 0 12px; font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 750; }
		#detail { min-height: 28px; margin: 0; color: #596579; }
		#start {
			margin-top: 20px;
			padding: 12px 24px;
			border: 0;
			border-radius: 12px;
			color: white;
			background: #315ee8;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}
		#start:hover { background: #244bc4; }
		#start:focus-visible { outline: 3px solid #172033; outline-offset: 3px; }
		.stats { margin-top: 18px; color: #596579; }
		.stats strong { color: #172033; }
	</style>
</head>
<body>
	<main>
		<h1>Reaction Timer</h1>
		<p class="intro">Wait for the screen to turn green, then click as quickly as you can.</p>
		<section id="arena" aria-live="polite">
			<div class="content">
				<p id="message">Ready?</p>
				<p id="detail">Press start when you're ready.</p>
				<button id="start" type="button">Start</button>
			</div>
		</section>
		<p class="stats">Best reaction: <strong id="best">—</strong></p>
	</main>
	<script>
		const arena = document.querySelector('#arena');
		const message = document.querySelector('#message');
		const detail = document.querySelector('#detail');
		const startButton = document.querySelector('#start');
		const bestDisplay = document.querySelector('#best');
		let state = 'idle';
		let timeoutId;
		let greenAt = 0;
		let best = null;

		function startRound() {
			clearTimeout(timeoutId);
			state = 'waiting';
			arena.className = 'waiting';
			message.textContent = 'Wait for green…';
			detail.textContent = 'Clicking before green counts as too early.';
			startButton.hidden = true;
			timeoutId = setTimeout(() => {
				state = 'go';
				arena.className = 'go';
				message.textContent = 'CLICK NOW!';
				detail.textContent = 'Tap anywhere in this box.';
				greenAt = performance.now();
			}, 2000 + Math.random() * 3000);
		}

		function handleArenaClick(event) {
			if (event.target === startButton) return;
			if (state === 'waiting') {
				clearTimeout(timeoutId);
				state = 'idle';
				arena.className = '';
				message.textContent = 'Too early!';
				detail.textContent = 'Wait until the screen turns green, then try again.';
				startButton.hidden = false;
				startButton.textContent = 'Try again';
			} else if (state === 'go') {
				const reaction = Math.round(performance.now() - greenAt);
				state = 'idle';
				arena.className = '';
				message.textContent = `${reaction} ms`;
				detail.textContent = 'Nice! Press below to play another round.';
				startButton.hidden = false;
				startButton.textContent = 'Play again';
				if (best === null || reaction < best) {
					best = reaction;
					bestDisplay.textContent = `${best} ms`;
				}
			}
		}

		startButton.addEventListener('click', startRound);
		arena.addEventListener('click', handleArenaClick);
	</script>
</body>
</html>
